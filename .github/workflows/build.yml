name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.instrument }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        instrument:
          - PicoFaceYC
          - PicoFaceCP
          - PicoFaceJ6
          - PicoFaceMD
          - PicoFaceSM
          - PicoFaceDX
          # GPL-3, unlike the other six - see instruments/PicoFaceOB/README.md
          - PicoFaceOB
          # PicoFaceRD, PicoFaceJV and PicoFaceD5 are not here: each needs a
          # local ROM set that cannot be distributed, so each is built from
          # source only. RD was in this list until its ROM data stopped being
          # in the repository.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # Full history and tags: the firmware version comes from git describe,
          # and a shallow clone has nothing to describe against. A release build
          # would show a bare commit hash instead of its own version number.
          fetch-depth: 0

      # The Ubuntu apt package gcc-arm-none-eabi ships an incomplete libstdc++
      # (missing headers such as <cstring>) and breaks this C++ build.
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 'latest'

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential python3 \
            libusb-1.0-0-dev pkg-config

      # The filter builds only this single instrument so the matrix jobs run
      # in parallel and failures stay isolated per instrument.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICOFACE_INSTRUMENTS_FILTER=${{ matrix.instrument }}

      - name: Build
        run: cmake --build build -j$(nproc)

      # pico_add_extra_outputs already creates the files under the instrument
      # name, so no renaming is needed.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/${{ matrix.instrument }}.uf2 \
             build/${{ matrix.instrument }}.elf \
             build/${{ matrix.instrument }}.bin \
             build/${{ matrix.instrument }}.elf.map \
             artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.instrument }}-firmware
          path: artifacts/*
          if-no-files-found: error

  # Everything under tools/host_tests that needs neither a sound card, a MIDI
  # port nor a ROM set: the core's veeprom, the D-50 laws, the OB-X engine
  # checks, the DX SysEx round trip, the J6 panel and patch store, the YC
  # engine render, the shared UI kit and the MD panel rendered to frames, and
  # one note through each CP voice. A release needs this green as much as the
  # seven firmware builds - a regression in the core shows up here, on a
  # Linux box, before it shows up on somebody's board.
  host-tests:
    name: Host tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Tags, because the UI kit's About frame names the nearest release.
          fetch-depth: 0

      # Only u8g2 is needed here, not the whole SDK tree the firmware pulls.
      - name: Fetch u8g2
        run: git submodule update --init --depth 1 lib/u8g2/u8g2

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Run host tests
        run: tools/host_tests/run_all.sh

      # The logs, and the rendered panels: a GUI change can be looked at from
      # the PR without flashing a board.
      - name: Upload logs and renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-tests
          path: |
            tools/host_tests/_out/*.log
            tools/host_tests/ui/out/*.pbm
            tools/host_tests/md/out/*.pbm
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [build, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # Collect all instrument artifacts into a single directory.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: PicoVintageSynthCollection ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
